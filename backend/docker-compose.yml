services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hydromon
      POSTGRES_PASSWORD: hydromon
      POSTGRES_DB: hydromon_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hydromon
      POSTGRES_PASSWORD: hydromon
      POSTGRES_DB: hydromon_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data:
