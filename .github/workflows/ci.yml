name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  # ==========================================
  # 1. DETEKSI PERUBAHAN FOLDER (Monorepo Filter)
  # ==========================================
  changes:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  # ==========================================
  # 2. BACKEND CI (Node.js + Postgres + Vitest)
  # ==========================================
  backend-ci:
    name: Backend (Express & Prisma)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hydromon
          POSTGRES_PASSWORD: hydromon
          POSTGRES_DB: hydromon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check if backend folder exists
        id: check-backend
        run: |
          if [ -d "backend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js 20
        if: steps.check-backend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        run: npx prisma generate

      - name: TypeScript Typecheck
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Prisma Migrations & Seed
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://hydromon:hydromon@localhost:5432/hydromon_test?schema=public
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Run Vitest Suite
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://hydromon:hydromon@localhost:5432/hydromon_test?schema=public
          JWT_SECRET: test-jwt-secret-min-16-characters-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-min-16-characters-ci
          ACCESS_TOKEN_EXPIRY: 15m
          REFRESH_TOKEN_EXPIRY_DAYS: 7
          BCRYPT_SALT_ROUNDS: 6
          PORT: 3000
          UPLOAD_DIR: ./uploads
          NODE_ENV: test
        run: npm test

      - name: Build Backend
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        run: npm run build

  # ==========================================
  # 3. WEB CI (React + Vite)
  # ==========================================
  web-ci:
    name: Web (React & Vite)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if web folder exists
        id: check-web
        run: |
          if [ -d "web" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js 20
        if: steps.check-web.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm ci

      - name: Run Web Tests (if present)
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm test --if-present

      - name: Build Web Client (Typecheck & Vite Build)
        if: steps.check-web.outputs.exists == 'true'
        working-directory: web
        run: npm run build

  # ==========================================
  # 4. MOBILE CI (Flutter)
  # ==========================================
  mobile-ci:
    name: Mobile (Flutter)
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if mobile folder exists
        id: check-mobile
        run: |
          if [ -d "mobile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter
        if: steps.check-mobile.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        if: steps.check-mobile.outputs.exists == 'true'
        working-directory: mobile
        run: flutter pub get

      - name: Analyze & Test Flutter
        if: steps.check-mobile.outputs.exists == 'true'
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
